  <!-- ═══ Frame Scrubber Engine (preserved from original) ═══ -->
  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const scrollTrack = document.getElementById('scroll-track');

      const FRAME_COUNT = 214;
      const getFrameSrc = (index) => `ezgif-frame-${String(index + 1).padStart(3, '0')}.jpg`;

      const images = new Array(FRAME_COUNT);
      let targetProgress = 0;
      let currentProgress = 0;
      let lastDrawnFrame = -1;
      const LERP_EASE = 0.08; // Smooth inertia damping factor

      // Source image native resolution
      const SRC_WIDTH = 1920;
      const SRC_HEIGHT = 1080;

      // High-DPI responsive canvas setup — cap DPR so we never upscale beyond source res
      function resizeCanvas() {
        const cssWidth = window.innerWidth;
        const cssHeight = window.innerHeight;
        const nativeDpr = window.devicePixelRatio || 1;

        // Cap DPR: don't create a backing buffer larger than the source can fill sharply
        const maxDprX = SRC_WIDTH / cssWidth;
        const maxDprY = SRC_HEIGHT / cssHeight;
        const maxUsefulDpr = Math.min(maxDprX, maxDprY);
        const dpr = Math.min(nativeDpr, Math.max(1, maxUsefulDpr));

        canvas.width = Math.round(cssWidth * dpr);
        canvas.height = Math.round(cssHeight * dpr);
        canvas.style.width = cssWidth + 'px';
        canvas.style.height = cssHeight + 'px';

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        if (lastDrawnFrame >= 0) {
          drawFrame(lastDrawnFrame, true);
        }
      }

      function drawFrame(frameIndex, forceRedraw = false) {
        if (!forceRedraw && frameIndex === lastDrawnFrame) return;

        let img = images[frameIndex];

        // Graceful fallback to nearest available loaded frame during fast scrubs
        if (!img || !img.complete || img.naturalWidth === 0) {
          for (let offset = 1; offset < FRAME_COUNT; offset++) {
            const prev = frameIndex - offset;
            if (prev >= 0 && images[prev]?.complete && images[prev]?.naturalWidth > 0) {
              img = images[prev];
              break;
            }
            const next = frameIndex + offset;
            if (next < FRAME_COUNT && images[next]?.complete && images[next]?.naturalWidth > 0) {
              img = images[next];
              break;
            }
          }
        }

        if (!img || !img.complete || img.naturalWidth === 0) return;

        const cw = canvas.width;
        const ch = canvas.height;
        const iw = img.naturalWidth;
        const ih = img.naturalHeight;

        // Always cover-fit: fill the canvas entirely, crop overflow
        const scale = Math.max(cw / iw, ch / ih);

        const dw = Math.round(iw * scale);
        const dh = Math.round(ih * scale);
        const dx = Math.round((cw - dw) / 2);
        const dy = Math.round((ch - dh) / 2);

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, dx, dy, dw, dh);

        lastDrawnFrame = frameIndex;
      }

      // Preload sequence with async decoding for hitch-free rendering
      function preloadImages() {
        // Immediately load frame 0 to render instantly
        const firstImg = new Image();
        firstImg.src = getFrameSrc(0);
        firstImg.onload = () => {
          images[0] = firstImg;
          drawFrame(0);
        };

        // Preload remaining frames
        for (let i = 0; i < FRAME_COUNT; i++) {
          if (i === 0) continue;
          const img = new Image();
          img.src = getFrameSrc(i);

          if ('decode' in img) {
            img.decode()
              .then(() => { images[i] = img; })
              .catch(() => { images[i] = img; });
          } else {
            img.onload = () => { images[i] = img; };
          }
        }
      }

      // Smooth animation update loop
      function onFrame() {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll > 0) {
          targetProgress = Math.max(0, Math.min(1, window.scrollY / maxScroll));
        } else {
          targetProgress = 0;
        }

        // Interpolate progress with exponential easing for buttery motion
        const diff = targetProgress - currentProgress;
        if (Math.abs(diff) < 0.00005) {
          currentProgress = targetProgress;
        } else {
          currentProgress += diff * LERP_EASE;
        }

        const frameIndex = Math.min(
          FRAME_COUNT - 1,
          Math.max(0, Math.round(currentProgress * (FRAME_COUNT - 1)))
        );

        drawFrame(frameIndex);

        // ── Hook: update portfolio sections with current progress ──
        if (window._portfolioUpdate) {
          window._portfolioUpdate(currentProgress);
        }

        requestAnimationFrame(onFrame);
      }

      // Event listeners
      window.addEventListener('resize', resizeCanvas, { passive: true });

      // Initialize
      resizeCanvas();
      preloadImages();
      requestAnimationFrame(onFrame);
    })();
  </script>
